<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Evance ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
  </style>
</head>
<body>

  <canvas id="heart"></canvas>

  <script>
    const canvas = document.getElementById('heart');
    const ctx = canvas.getContext('2d');
    let width, height, dpr;

    function resize() {
      dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    // ---------- Helpers to build point clouds ---------- //
    function heartPoints(count, scale) {
      const pts = [];
      for (let i = 0; i < count; i++) {
        const t = Math.PI - (i / count) * 2 * Math.PI;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        pts.push({ x: x * scale, y: y * scale });
      }
      return pts;
    }

    function heartFilledPoints(count, scale) {
      const pts = [];
      let attempts = 0;
      while (pts.length < count && attempts < count * 40) {
        attempts++;
        const x = (Math.random() * 2 - 1) * 18;
        const y = (Math.random() * 2 - 1) * 18;
        const nx = x / 15, ny = -y / 15 + 0.4;
        const val = Math.pow(nx * nx + ny * ny - 1, 3) - nx * nx * ny * ny * ny;
        if (val <= 0) {
          pts.push({ x: x * scale, y: y * scale });
        }
      }
      return pts;
    }

    // Handles multi-line text mapping smoothly
    function multiLineTextPoints(lines, count, fontSize, fontFamily) {
      const off = document.createElement('canvas');
      const octx = off.getContext('2d');
      
      const maxLength = Math.max(...lines.map(l => l.length));
      const w = Math.max(500, maxLength * fontSize * 0.7);
      const h = fontSize * 1.4 * lines.length + fontSize;
      
      off.width = w;
      off.height = h;
      octx.fillStyle = '#fff';
      octx.font = `bold ${fontSize}px ${fontFamily}`;
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      
      lines.forEach((line, index) => {
        const yPos = (h / 2) - ((lines.length - 1) * fontSize * 0.6) + (index * fontSize * 1.2);
        octx.fillText(line, w / 2, yPos);
      });
      
      const data = octx.getImageData(0, 0, w, h).data;
      const candidates = [];
      const step = 2;
      for (let y = 0; y < h; y += step) {
        for (let x = 0; x < w; x += step) {
          const idx = (y * w + x) * 4;
          if (data[idx + 3] > 128) {
            candidates.push({ x: x - w / 2, y: y - h / 2 });
          }
        }
      }
      const pts = [];
      for (let i = 0; i < count; i++) {
        const c = candidates[Math.floor(Math.random() * candidates.length)];
        if (c) pts.push({ x: c.x, y: c.y });
      }
      return pts;
    }

    // ---------- Particle system ----------
    const PARTICLE_COUNT = 1500; // Increased slightly for crisp text layout

    class Particle {
      constructor(home) {
        this.home = home;
        this.x = (Math.random() - 0.5) * width * 1.5;
        this.y = (Math.random() - 0.5) * height * 1.5;
        this.vx = 0;
        this.vy = 0;
        this.size = 1.2 + Math.random() * 2.2;
        this.hueShift = Math.random() * 30 - 15;
        this.target = home;
      }

      update(ease, friction, pulse) {
        const tx = this.target.x * pulse;
        const ty = this.target.y * pulse;
        const dx = tx - this.x;
        const dy = ty - this.y;
        this.vx += dx * ease;
        this.vy += dy * ease;
        this.vx *= friction;
        this.vy *= friction;
        this.x += this.vx;
        this.y += this.vy;
      }
    }

    let particles = [];
    let heartSet = [];
    let textSet = [];

    function buildSets() {
      const baseScale = Math.min(width, height) / 34;
      heartSet = heartFilledPoints(PARTICLE_COUNT, baseScale);
      
      // Scaling text adaptively to keep it looking great on mobile and desktop
      const fontSize = Math.min(width, height) * 0.075;
      textSet = multiLineTextPoints(['I LOVE YOU EVANCE', 'YOU ARE MY FOREVER'], PARTICLE_COUNT, fontSize, 'Georgia, serif');
      
      while (heartSet.length < PARTICLE_COUNT) heartSet.push(heartSet[heartSet.length % heartSet.length] || { x: 0, y: 0 });
      while (textSet.length < PARTICLE_COUNT) textSet.push(textSet[Math.floor(Math.random() * textSet.length)] || { x: 0, y: 0 });
      
      if (particles.length === 0) {
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          particles.push(new Particle(heartSet[i]));
        }
      } else {
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          particles[i].home = heartSet[i];
        }
      }
    }

    buildSets();

    window.addEventListener('resize', () => {
      resize();
      buildSets();
    });

    // ---------- Animation state machine ----------
    let phase = 'formHeart';
    let phaseStart = performance.now();
    const DURATIONS = {
      formHeart: 1800,
      holdHeart: 900,
      beat: 1600,
      toText: 1800,
      holdText: 3200, // Kept text visible slightly longer to make reading comfortable
      toHeart: 1800,
    };

    function setTargets(set) {
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles[i].target = set[i];
      }
    }

    function centerOffset() {
      return { cx: width / 2, cy: height / 2 };
    }

    function draw(now) {
      const elapsed = now - phaseStart;
      const { cx, cy } = centerOffset();

      if (phase === 'formHeart' && elapsed > DURATIONS.formHeart) {
        phase = 'holdHeart';
        phaseStart = now;
      } else if (phase === 'holdHeart' && elapsed > DURATIONS.holdHeart) {
        phase = 'beat';
        phaseStart = now;
      } else if (phase === 'beat' && elapsed > DURATIONS.beat) {
        setTargets(textSet);
        phase = 'toText';
        phaseStart = now;
      } else if (phase === 'toText' && elapsed > DURATIONS.toText) {
        phase = 'holdText';
        phaseStart = now;
      } else if (phase === 'holdText' && elapsed > DURATIONS.holdText) {
        setTargets(heartSet);
        phase = 'toHeart';
        phaseStart = now;
      } else if (phase === 'toHeart' && elapsed > DURATIONS.toHeart) {
        setTargets(heartSet); 
        phase = 'holdHeart';
        phaseStart = now;
      }

      let pulse = 1;
      if (phase === 'beat') {
        const t = elapsed / DURATIONS.beat;
        pulse = 1 + Math.sin(t * Math.PI * 4) * 0.08 * (1 - t * 0.3);
      }

      ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
      ctx.fillRect(0, 0, width, height);

      const ease = 0.045;
      const friction = 0.82;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.update(ease, friction, pulse);
        const px = cx + p.x;
        const py = cy + p.y;
        const hue = 340 + p.hueShift;
        ctx.beginPath();
        ctx.fillStyle = `hsl(${hue}, 85%, ${60 + Math.random() * 10}%)`;
        ctx.arc(px, py, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, width, height);
    requestAnimationFrame(draw);
  </script>
</body>
</html>
